[package]
name = "ai-gateway"
version = "0.2.0"
edition = "2021"
description = "An OpenAI-compatible gateway that routes requests to Ollama, OpenAI and other OpenAI-style backends by model prefix, with API keys, rate limits, fallback and usage stats"
license = "Apache-2.0"
repository = "https://github.com/LuisMongeB/ai-gateway"

[dependencies]
# No default features: no request decompression, cookies or HTTP/2, none of which the gateway uses.
actix-web = { version = "4", default-features = false, features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: forwarded JSON keeps its key order (structured outputs are generated in schema order).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-stream = "0.3"
futures = "0.3"
bytes = "1"
sha2 = "0.11"
dotenvy = "0.15"
# Microsoft Entra sign-in for Azure upstreams. No default features: no HTTP
# client of their own (the gateway's reqwest is plugged in) and no crypto
# library compiled from C. `tokio` runs `az` without blocking a worker.
azure_identity = { version = "1", default-features = false, features = ["tokio"] }
azure_core = { version = "1", default-features = false, features = ["tokio"] }
async-trait = "0.1"

[dev-dependencies]
actix-http = "3"
tempfile = "3"
wiremock = "0.6"
