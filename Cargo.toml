[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-stream = "0.3"
futures = "0.3"
bytes = "1"
sha2 = "0.11"
dotenvy = "0.15"

[dev-dependencies]
actix-http = "3"
wiremock = "0.6"
