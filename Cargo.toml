[package]
name = "ai-gateway"
version = "0.2.0"
edition = "2021"
description = "An OpenAI-compatible gateway that routes requests to Ollama, OpenAI and other OpenAI-style backends by model prefix, with API keys, rate limits, fallback and usage stats"
license = "Apache-2.0"
repository = "https://github.com/LuisMongeB/ai-gateway"

[dependencies]
actix-web = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-stream = "0.3"
futures = "0.3"
bytes = "1"
sha2 = "0.11"
dotenvy = "0.15"

[dev-dependencies]
actix-http = "3"
tempfile = "3"
wiremock = "0.6"
